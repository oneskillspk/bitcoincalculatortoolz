    <div id="root" aria-label="Bitcoin Calculator App"><!--
      Pre-hydrate brand seed. createRoot() atomically replaces this on
      mount — zero flicker. Sub-500ms paints show nothing thanks to the
      opacity fade-in delay. Reuses the inlined :root tokens above so
      colors match the app shell exactly. Pure CSS, no JS, no requests.
    --><style>
      .bct-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:hsl(var(--surface-paper));color:hsl(var(--ink));font-family:'Sora',ui-sans-serif,system-ui,sans-serif;opacity:0;animation:bct-splash-in .28s ease-out .32s forwards;z-index:1}
      .bct-splash__mark{width:56px;height:56px;color:hsl(var(--ember));filter:drop-shadow(0 6px 18px hsl(var(--ember)/.18))}
      .bct-splash__word{font-size:15px;font-weight:600;letter-spacing:.02em;line-height:1;margin:0}
      .bct-splash__rule{width:44px;height:1px;background:hsl(var(--hairline));border:0;margin:2px 0 0}
      .bct-splash__tag{font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--ink-muted));margin:0}
      .bct-splash__dots{display:flex;gap:6px;margin-top:6px}
      .bct-splash__dots span{width:5px;height:5px;border-radius:50%;background:hsl(var(--ember)/.5);animation:bct-splash-pulse 1.1s ease-in-out infinite}
      .bct-splash__dots span:nth-child(2){animation-delay:.15s}
      .bct-splash__dots span:nth-child(3){animation-delay:.3s}
      .bct-splash__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      @keyframes bct-splash-in{to{opacity:1}}
      @keyframes bct-splash-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){.bct-splash{animation:none;opacity:1}.bct-splash__dots span{animation:none;opacity:.6}}
    </style><div class="bct-splash" role="status" aria-live="polite"><svg class="bct-splash__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.767 19.089c4.924.868 6.14-6.025 1.216-6.894m-1.216 6.894L5.86 18.047m5.908 1.042-.347 1.97m1.563-8.864c4.924.869 6.14-6.025 1.215-6.893m-1.215 6.893-3.94-.694m5.155-6.2L8.29 4.26m5.908 1.042.348-1.97M7.48 20.364l3.126-17.727"/></svg><p class="bct-splash__word">Bitcoin Calculator</p><hr class="bct-splash__rule" /><p class="bct-splash__tag">49+ free tools · live prices</p><div class="bct-splash__dots" aria-hidden="true"><span></span><span></span><span></span></div><span class="bct-splash__sr">Loading Bitcoin Calculator…</span></div></div>
