      /* Inline splash screen styles — visible before app CSS bundle loads.
         Designed to look identical in light/dark and LTR/RTL. */
      .splash-container{position:fixed;inset:0;width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;z-index:9999;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(at 20% 10%,hsla(13,79%,57%,0.05) 0,transparent 50%),radial-gradient(at 85% 0%,hsla(13,60%,50%,0.03) 0,transparent 50%),linear-gradient(180deg,hsl(40 22% 95%) 0%,hsl(40 20% 92%) 100%);color:hsl(0 0% 10%);}
      .splash-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;max-width:340px;text-align:center;animation:splash-in .45s cubic-bezier(.16,1,.3,1) both;}
      .splash-icon{display:flex;align-items:center;justify-content:center;width:72px;height:72px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,hsl(13 79% 57% / .1),transparent 70%);animation:splash-float 2.6s ease-in-out infinite;}
      .splash-icon svg{display:block;width:100%;height:100%;}
      .splash-title{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:700;line-height:1.3;letter-spacing:-0.02em;margin:0;font-family:'Sora','Manrope',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;}
      .splash-subtitle{font-size:.9rem;font-weight:500;color:hsl(0 0% 40%);margin:0;font-family:'Manrope',system-ui,sans-serif;}
      .splash-loader{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem;direction:ltr;}
      .splash-loader span{width:7px;height:7px;border-radius:50%;background:hsl(13 79% 57%);animation:splash-pulse 1s ease-in-out infinite;}
      .splash-loader span:nth-child(2){animation-delay:.15s;}
      .splash-loader span:nth-child(3){animation-delay:.3s;}
      [dir="rtl"] .splash-content{text-align:center;}
      @keyframes splash-in{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:none;}}
      @keyframes splash-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
      @keyframes splash-pulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
      @media (prefers-reduced-motion:reduce){.splash-content,.splash-icon,.splash-loader span{animation:none!important;}}
      @media (prefers-color-scheme:dark){
        .splash-container{background:radial-gradient(at 20% 10%,hsla(20,85%,55%,0.1) 0,transparent 50%),radial-gradient(at 85% 0%,hsla(20,80%,45%,0.06) 0,transparent 50%),linear-gradient(180deg,hsl(222 30% 6%) 0%,hsl(222 30% 9%) 100%);color:hsl(40 20% 96%);}
        .splash-subtitle{color:hsl(40 10% 70%);}
        .splash-icon{background:radial-gradient(circle,hsl(13 79% 60% / .18),transparent 70%);}
        .splash-icon svg circle{stroke:hsl(20 90% 62%);stroke-opacity:.5;}
        .splash-icon svg text{fill:hsl(40 20% 96%);}
        .splash-loader span{background:hsl(20 90% 62%);}
      }

                  document.getElementById('splash-title').textContent = 'Bitcoin Hesaplayıcı Araçları';
                  document.getElementById('splash-subtitle').textContent = 'Canlı BTC verileri yükleniyor…';

                }
              } catch (e) {}
            })();
          </script>
        </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safety net: if the React app hasn't mounted within 12s (broken chunk
      // after a deploy, network error, etc.), force a one-time cache-busting
      // reload. Prevents users from being stuck on the splash forever.
      (function () {
        var RELOAD_KEY = '__bct_splash_reload__';
        var TIMEOUT_MS = 12000;
        setTimeout(function () {
          var splash = document.querySelector('.splash-container');
          var mounted = document.getElementById('root') &&
            document.getElementById('root').querySelector(':not(.splash-container)');
          if (splash && !mounted) {
            try {
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  keys.forEach(function (k) { caches.delete(k); });
                });
              }
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  regs.forEach(function (r) { r.unregister(); });
                });
              }
            } catch (e) {}
            if (!sessionStorage.getItem(RELOAD_KEY)) {
              sessionStorage.setItem(RELOAD_KEY, '1');
              window.location.reload();
            }
          } else {
            sessionStorage.removeItem(RELOAD_KEY);
          }
        }, TIMEOUT_MS);
      })();
    </script>
