<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Fallback title — react-helmet-async overrides this per page -->
    <title data-rh="true">Bitcoin Calculator Tools</title>

    <!-- Critical CSS inlined for faster initial render -->
    <style>
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}::before,::after{--tw-content:''}html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";font-feature-settings:normal;font-display:swap}body{margin:0;line-height:inherit}h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}a{color:inherit;text-decoration:inherit}button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}button,select{text-transform:none}button,[type='button'],[type='reset'],[type='submit']{-webkit-appearance:button;background-color:transparent;background-image:none}:-moz-focusring{outline:auto}:-moz-ui-invalid{box-shadow:none}progress{vertical-align:baseline}::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}[type='search']{-webkit-appearance:textfield;outline-offset:-2px}::-webkit-search-decoration{-webkit-appearance:none}::-webkit-file-upload-button{-webkit-appearance:button;font:inherit}summary{display:list-item}blockquote,dl,dd,h1,h2,h3,h4,h5,h6,hr,figure,p,pre{margin:0}fieldset{margin:0;padding:0}legend{padding:0}ol,ul,menu{list-style:none;margin:0;padding:0}textarea{resize:vertical}input::placeholder,textarea::placeholder{opacity:1;color:#9ca3af}button,[role="button"]{cursor:pointer}:disabled{cursor:default}img,svg,video,canvas,audio,iframe,embed,object{display:block;vertical-align:middle}img,video{max-width:100%;height:auto}[hidden]{display:none}:root{--background:0 0% 100%;--foreground:222 84% 5%;--card:0 0% 100%;--card-foreground:222 84% 5%;--popover:0 0% 100%;--popover-foreground:222 84% 5%;--primary:25 95% 35%;--primary-foreground:0 0% 100%;--primary-glow:25 95% 45%;--secondary:210 40% 98%;--secondary-foreground:222 84% 5%;--muted:210 40% 96%;--muted-foreground:215 16% 15%;--accent:25 95% 38%;--accent-foreground:0 0% 100%;--destructive:0 84% 50%;--destructive-foreground:0 0% 100%;--border:214 32% 91%;--input:214 32% 91%;--ring:25 95% 53%;--radius:0.75rem;--gradient-light:linear-gradient(135deg,hsl(0 0% 100%) 0%,hsl(210 40% 98%) 100%);--gradient-card:linear-gradient(135deg,hsl(0 0% 100%) 0%,hsl(210 20% 98%) 100%);--gradient-bitcoin:linear-gradient(135deg,hsl(25 95% 38%) 0%,hsl(39 100% 45%) 100%);--gradient-hero:linear-gradient(135deg,hsl(0 0% 100%) 0%,hsl(210 40% 98%) 100%);--gradient-premium:linear-gradient(135deg,hsl(0 0% 100%) 0%,hsl(210 40% 98%) 100%);--shadow-sm:0 1px 3px 0 hsl(0 0% 0% / 0.05);--shadow-md:0 4px 6px -1px hsl(0 0% 0% / 0.07);--shadow-lg:0 10px 15px -3px hsl(0 0% 0% / 0.08);--shadow-xl:0 20px 25px -5px hsl(0 0% 0% / 0.10);--shadow-glow:0 0 20px hsl(25 95% 53% / 0.15);--transition-smooth:all 0.3s cubic-bezier(0.4,0,0.2,1);--transition-spring:all 0.5s cubic-bezier(0.34,1.56,0.64,1);--transition-glow:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94)}*{border-color:hsl(var(--border))}html{scroll-behavior:smooth}body{background:hsl(var(--background));color:hsl(var(--foreground));font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--gradient-light);min-height:100vh;font-feature-settings:'kern' 1,'liga' 1,'calt' 1,'pnum' 1,'tnum' 0,'onum' 1,'lnum' 0,'dlig' 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}h1,h2,h3,h4,h5,h6{font-weight:600;line-height:1.25;letter-spacing:-0.025em;font-feature-settings:'kern' 1,'liga' 1,'calt' 1,'dlig' 1}.splash-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:hsl(0 0% 100%);position:relative;overflow:hidden}.splash-container::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,hsl(25 95% 53% / 0.06) 0%,transparent 60%);border-radius:50%;pointer-events:none}.splash-content{text-align:center;position:relative;z-index:10;padding:1.5rem}.splash-icon{width:44px;height:44px;margin:0 auto 1.25rem;border-radius:11px;background:linear-gradient(135deg,hsl(25 95% 38%),hsl(39 100% 45%));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px hsl(25 95% 45% / 0.2)}.splash-icon svg{width:22px;height:22px;color:#fff}.splash-title{font-size:clamp(1.125rem,3.5vw,1.5rem);font-weight:600;color:hsl(222 84% 5%);margin:0 0 0.375rem;letter-spacing:-0.025em;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}.splash-subtitle{font-size:0.8125rem;color:hsl(215 16% 47%);margin:0 0 1.75rem;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}.splash-loader{display:flex;align-items:center;justify-content:center;gap:5px}.splash-loader span{width:5px;height:5px;border-radius:50%;background:hsl(25 95% 42%);animation:pulse-dot 1.4s ease-in-out infinite}.splash-loader span:nth-child(2){animation-delay:0.2s}.splash-loader span:nth-child(3){animation-delay:0.4s}@keyframes pulse-dot{0%,80%,100%{opacity:0.25;transform:scale(0.8)}40%{opacity:1;transform:scale(1.15)}}#root{display:contents}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:calc(var(--radius) - 2px);font-size:0.875rem;font-weight:500;transition:var(--transition-smooth);background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:var(--shadow-sm);padding:0.5rem 1rem;text-decoration:none}.btn:hover{background:hsl(var(--primary-glow));box-shadow:var(--shadow-md)}
    </style>

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <meta name="apple-mobile-web-app-title" content="Bitcoin Calculator App">
    <meta name="application-name" content="Bitcoin Calculator App">

    <meta property="og:image" content="https://bitcoincalculator.tools/social-preview.webp" data-rh="true">
    <meta property="og:image:width" content="1200" data-rh="true">
    <meta property="og:image:height" content="630" data-rh="true">
    <meta name="twitter:image" content="https://bitcoincalculator.tools/social-preview.webp" data-rh="true">

    <!-- Performance & Core Web Vitals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.coingecko.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Typography — single non-blocking request bundling Inter, Roboto, Libre Caslon, Roboto Mono -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700&family=Roboto:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700&family=Roboto:wght@400;500;700&family=Libre+Caslon+Text:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" /></noscript>

  </head>

  <body>
    <div id="root">
      <div class="splash-container">
        <div class="splash-content">
          <div class="splash-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11.767 19.089c4.924.868 6.14-6.025 1.216-6.894m-1.216 6.894L5.86 18.047m5.908 1.042-.347 1.97m1.563-8.864c4.924.869 6.14-6.025 1.215-6.893m-1.215 6.893-3.94-.694m5.155-6.2L8.29 4.26m5.908 1.042.348-1.97M7.48 20.364l3.126-17.727"/>

    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
