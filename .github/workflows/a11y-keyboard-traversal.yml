name: A11y — keyboard traversal

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'e2e/a11y-keyboard-traversal.spec.ts'
      - '.github/workflows/a11y-keyboard-traversal.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lockb'
  push:
    branches: [main]

jobs:
  a11y-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build
        env:
          CI: 'true'

      - name: Run keyboard traversal matrix
        # Drives every public route × viewport with the Tab key only and
        # asserts focus is visible, interactive, non-trapping, reversible
        # via Shift+Tab, and reaches <main>.
        run: npx playwright test e2e/a11y-keyboard-traversal.spec.ts --project=chromium-desktop
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-keyboard
          path: playwright-report
